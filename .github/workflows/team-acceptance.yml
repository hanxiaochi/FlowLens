name: Team delivery acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'team*'
      - 'team-vendor/**'
      - 'forms*.mjs'
      - 'forms*.js'
      - 'forms.css'
      - 'apps*.mjs'
      - 'apps*.js'
      - 'studio.*'
      - 'scripts/build-demo.mjs'
      - 'scripts/*team*'
      - 'Dockerfile.team'
      - 'compose.team.yaml'
      - 'deploy/Caddyfile'
      - '.dockerignore'
      - 'package*.json'
      - '.github/workflows/team-acceptance.yml'
permissions:
  contents: read
jobs:
  node:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:team
      - run: npm run build:demo
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/verify-team-container.mjs
      - run: node scripts/verify-team-compose.mjs
