name: 试用反馈 / Trial feedback
description: 告诉我哪张表、哪一步没有走通 / Tell us where your workflow gets stuck.
title: "[试用反馈] "
body:
  - type: markdown
    attributes:
      value: "感谢试用。请不要上传客户原件、个人信息、密钥或未获授权的资料；使用脱敏样例即可。Thanks for trying FlowLens. Use anonymized examples only."
  - type: textarea
    id: scenario
    attributes:
      label: 你想办理什么业务？ / Your scenario
      description: 表格用途、谁填写、谁审核，简单说清楚就好。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 你在哪一步卡住了？ / Where did you get stuck?
      description: 操作步骤、预期结果、实际结果；也欢迎说哪一步有帮助。
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: 使用方式 / Environment
      options:
        - 在线 Demo / Public demo
        - 本机运行 / Local installation
    validations:
      required: true
  - type: textarea
    id: next
    attributes:
      label: 哪个改进会让你愿意继续用？ / What would make you use it again?
